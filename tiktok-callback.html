<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TikTok Connected - Frame &amp; Score</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<nav><a href="./">Home</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a></nav>
<h1 id="h">Connecting TikTok&hellip;</h1>
<p id="msg" class="muted"></p>
<pre id="url" style="white-space:pre-wrap;word-break:break-all;display:none"></pre>
<button id="copy" style="display:none">Copy</button>
<script>
const q = new URLSearchParams(location.search), h = document.getElementById("h"), m = document.getElementById("msg");
if (q.get("code")) {
  h.textContent = "TikTok account connected";
  m.textContent = "Copy this full URL and paste it into the Frame & Score Studio setup window. It expires in a few minutes.";
  const u = document.getElementById("url"), b = document.getElementById("copy");
  u.textContent = location.href; u.style.display = b.style.display = "block";
  b.onclick = () => navigator.clipboard.writeText(location.href).then(() => b.textContent = "Copied");
} else {
  h.textContent = "Not connected";
  m.textContent = q.get("error") ? "TikTok returned: " + q.get("error") + " " + (q.get("error_description") || "") : "No authorization code found.";
}
</script>
</main></body></html>
